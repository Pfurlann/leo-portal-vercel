<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - LEO Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
      padding: 40px;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo-container img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
    
    h1 {
      color: #212529;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #6c757d;
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #495057;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    input[type="password"]:focus {
      outline: none;
      border-color: #495057;
    }
    
    small {
      color: #6c757d;
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    
    .btn-primary {
      background: #495057;
      color: #fff;
    }
    
    .btn-primary:hover {
      background: #3d4145;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(73, 80, 87, 0.3);
    }
    
    .btn-primary:disabled {
      background: #adb5bd;
      cursor: not-allowed;
      transform: none;
    }
    
    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    
    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    
    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="https://i.imgur.com/WZhg99L.png" alt="Logo Distrito LEO LD-8">
    </div>
    
    <h1>Redefinir Senha</h1>
    <p class="subtitle">Digite sua nova senha</p>
    
    <form id="formRedefinir" onsubmit="redefinirSenha(event)">
      <div class="form-group">
        <label for="novaSenha">Nova Senha</label>
        <input type="password" id="novaSenha" name="novaSenha" placeholder="Digite sua nova senha" required autofocus minlength="6">
        <small>Mínimo de 6 caracteres</small>
      </div>
      
      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua nova senha" required minlength="6">
      </div>
      
      <div id="mensagem" class="message"></div>
      
      <button type="submit" class="btn btn-primary" id="btnRedefinir">
        Redefinir Senha
      </button>
    </form>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_CONFIG = {
      url: 'https://bqkttaflhtsdkamgscnf.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxa3R0YWZsaHRzZGthbWdzY25mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcxOTA4MjEsImV4cCI6MjA4Mjc2NjgyMX0.yGxyrn2nMTEbl6w8Lk8HwsblgqNzGS36ckZBGXAIitQ'
    };
    
    let supabase = null;
    
    function inicializarSupabase() {
      if (typeof supabase === 'undefined' || !window.supabase) {
        console.error('Supabase SDK não carregado');
        return null;
      }
      return window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
    }
    
    async function redefinirSenha(event) {
      event.preventDefault();
      
      const novaSenhaInput = document.getElementById('novaSenha');
      const confirmarSenhaInput = document.getElementById('confirmarSenha');
      const btnRedefinir = document.getElementById('btnRedefinir');
      const mensagemDiv = document.getElementById('mensagem');
      
      const novaSenha = novaSenhaInput.value.trim();
      const confirmarSenha = confirmarSenhaInput.value.trim();
      
      // Validações
      if (!novaSenha) {
        mostrarMensagem('Por favor, digite a nova senha.', 'error');
        return;
      }
      
      if (novaSenha.length < 6) {
        mostrarMensagem('A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }
      
      if (novaSenha !== confirmarSenha) {
        mostrarMensagem('As senhas não coincidem.', 'error');
        return;
      }
      
      // Inicializar Supabase
      if (!supabase) {
        supabase = inicializarSupabase();
        if (!supabase) {
          mostrarMensagem('Erro ao inicializar sistema. Tente novamente.', 'error');
          return;
        }
      }
      
      // Desabilitar botão
      btnRedefinir.disabled = true;
      btnRedefinir.textContent = 'Redefinindo...';
      mensagemDiv.className = 'message';
      mensagemDiv.style.display = 'none';
      
      try {
        // Atualizar senha
        const { data, error } = await supabase.auth.updateUser({
          password: novaSenha
        });
        
        if (error) {
          console.error('❌ Erro ao redefinir senha:', error);
          let mensagemErro = 'Erro ao redefinir senha. Tente novamente.';
          if (error.message.includes('same')) {
            mensagemErro = 'A nova senha deve ser diferente da senha atual.';
          } else if (error.message.includes('weak')) {
            mensagemErro = 'A senha é muito fraca. Use uma senha mais forte.';
          } else if (error.message.includes('expired') || error.message.includes('invalid')) {
            mensagemErro = 'Link expirado ou inválido. Solicite um novo link de recuperação.';
          }
          mostrarMensagem(mensagemErro, 'error');
          btnRedefinir.disabled = false;
          btnRedefinir.textContent = 'Redefinir Senha';
          return;
        }
        
        // Sucesso
        mostrarMensagem('✅ Senha redefinida com sucesso! Redirecionando para login...', 'success');
        
        // Redirecionar para login após 2 segundos
        setTimeout(() => {
          const baseUrl = 'https://script.google.com/a/macros/leold8.org.br/s/AKfycbyxhzZE30640fN97YFvn3Oi-EFdpuK6N4xju8yyP0etbWQhuhoB_3RCec7yvQ1JAu2MTA/exec';
          window.location.href = baseUrl + '?page=rtma';
        }, 2000);
        
      } catch (error) {
        console.error('❌ Erro inesperado:', error);
        mostrarMensagem('Erro ao redefinir senha. Tente novamente.', 'error');
        btnRedefinir.disabled = false;
        btnRedefinir.textContent = 'Redefinir Senha';
      }
    }
    
    function mostrarMensagem(texto, tipo) {
      const mensagemDiv = document.getElementById('mensagem');
      mensagemDiv.textContent = texto;
      mensagemDiv.className = 'message ' + tipo;
      mensagemDiv.style.display = 'block';
    }
    
    // Verificar se há hash de recuperação na URL
    window.addEventListener('DOMContentLoaded', async function() {
      const hash = window.location.hash;
      
      if (hash && hash.includes('access_token')) {
        // Inicializar Supabase
        if (!supabase) {
          supabase = inicializarSupabase();
        }
        
        // Tentar fazer login com o token do hash
        try {
          const { data, error } = await supabase.auth.getSession();
          
          if (error || !data.session) {
            mostrarMensagem('Link inválido ou expirado. Solicite um novo link de recuperação.', 'error');
            setTimeout(() => {
              const baseUrl = 'https://script.google.com/a/macros/leold8.org.br/s/AKfycbyxhzZE30640fN97YFvn3Oi-EFdpuK6N4xju8yyP0etbWQhuhoB_3RCec7yvQ1JAu2MTA/exec';
              window.location.href = baseUrl + '?page=recuperar_senha';
            }, 3000);
          }
        } catch (error) {
          console.error('Erro ao verificar sessão:', error);
          mostrarMensagem('Erro ao processar link. Tente novamente.', 'error');
        }
      } else {
        // Sem hash, redirecionar para recuperar senha
          mostrarMensagem('Link inválido. Redirecionando...', 'error');
        setTimeout(() => {
          const baseUrl = 'https://script.google.com/a/macros/leold8.org.br/s/AKfycbyxhzZE30640fN97YFvn3Oi-EFdpuK6N4xju8yyP0etbWQhuhoB_3RCec7yvQ1JAu2MTA/exec';
          window.location.href = baseUrl + '?page=recuperar_senha';
        }, 2000);
      }
    });
  </script>
</body>
</html>
