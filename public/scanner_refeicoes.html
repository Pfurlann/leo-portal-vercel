  <script>
    // Quando esta página é servida via ContentService (sem HtmlService),
    // `google.script.run` não existe. Criamos um proxy que chama o Apps Script via fetch (doPost?api=...).
    (function() {
      try {
        if (typeof google !== 'undefined' && google.script && google.script.run) return;
        var baseUrl = (location && location.href ? location.href.split('?')[0] : '');
        if (!baseUrl) return;

        function callApi(nome, args) {
          var url = baseUrl + '?api=' + encodeURIComponent(String(nome || ''));
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ args: Array.isArray(args) ? args : [] })
          }).then(function(r) {
            return r.text().then(function(t) {
              try { return JSON.parse(t); } catch (e) { throw new Error(t || ('HTTP ' + r.status)); }
            });
          });
        }

        function createChain() {
          var success = null;
          var failure = null;
          var chain = {};
          var proxy = new Proxy(chain, {
            get: function(_, prop) {
              if (prop === 'withSuccessHandler') return function(fn) { success = fn; return proxy; };
              if (prop === 'withFailureHandler') return function(fn) { failure = fn; return proxy; };
              return function() {
                var callArgs = Array.prototype.slice.call(arguments);
                callApi(prop, callArgs).then(function(res) {
                  if (typeof success === 'function') success(res);
                }).catch(function(err) {
                  var e = { message: (err && err.message) ? err.message : String(err) };
                  if (typeof failure === 'function') failure(e);
                });
              };
            }
          });
          return proxy;
        }

        window.google = window.google || {};
        window.google.script = window.google.script || {};
        window.google.script.run = createChain();
      } catch (e) {
        // se der erro aqui, o scanner vai mostrar a mensagem padrão do próprio código
      }
    })();
  </script>

  <script>
    (function() {
      var BATCH_SIZE = 25;
      var BLOQUEIO_MESMO_QR_MS = 800;
      var BLOQUEIO_REJEICAO_MS = 10000;
      var CACHE_BLOQUEIO_TTL_MS = 30 * 60 * 1000;
      var OVERLAY_DURATION = 500;
      var OVERLAY_ENVIO_DURATION = 2500;
      var OVERLAY_ERRO_DURATION = 2000;
      var html5QrCode = null;
      var processando = false;

      if (typeof EVENTO_NOME !== 'undefined' && EVENTO_NOME) {
        var tituloEl = document.getElementById('scanner-titulo');
        var eventoNomeEl = document.getElementById('scanner-evento-nome');
        if (tituloEl) tituloEl.textContent = 'Scanner – Passaporte – ' + EVENTO_NOME;
        if (eventoNomeEl) { eventoNomeEl.textContent = EVENTO_NOME; eventoNomeEl.style.display = 'block'; }
        if (document.title && document.title.indexOf('Scanner') === 0) document.title = 'Scanner Passaporte – ' + EVENTO_NOME + ' | LEO Portal';
      } else {
        var eventoNomeEl = document.getElementById('scanner-evento-nome');
        if (eventoNomeEl) eventoNomeEl.style.display = 'none';
      }

      var statusEl = document.getElementById('status');
      var erroContainer = document.getElementById('erro-container');
      var filaContadorEl = document.getElementById('fila-contador');
      var btnEnviar = document.getElementById('btn-enviar');

      function mostrarErro(msg) {
        if (erroContainer) erroContainer.innerHTML = '<div class="erro-msg">' + String(msg).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
        if (statusEl) statusEl.textContent = msg;
      }

      var STORE_KEY = 'leo_scanner_fila_' + (EVENTO_ID || 'default');
      var CACHE_CRED_KEY = 'leo_scanner_cache_credenciamento_' + (EVENTO_ID || 'default');
      var CACHE_ALIMENTACAO_KEY = 'leo_scanner_cache_alimentacao_' + (EVENTO_ID || 'default');
      var CACHE_BLOQUEIO_KEY = 'leo_scanner_bloqueios_' + (EVENTO_ID || 'default');
      var CACHE_TTL_MS = 30 * 60 * 1000;
      var cacheCredenciamento = null;
      var cacheAlimentacao = null;
      var cacheCarregamento = { alimentacao: false, credenciamento: false };
      var cachePronto = false;
      var cachePlenaria = null;
      var cachePlenariaPronto = false;

      function atualizarStatusCarregamento() {
        if (!statusEl) return;
        var tipoLeituraSelect = document.getElementById('tipo-leitura');
        var modo = (tipoLeituraSelect && tipoLeituraSelect.value) ? tipoLeituraSelect.value : 'alimentacao';
        if (modo === 'plenaria') {
          if (cachePlenariaPronto && cachePlenaria) {
            cachePronto = true;
            statusEl.textContent = 'Pronto para escanear (plenária) ✓';
            statusEl.classList.add('pronto');
          } else {
            cachePronto = false;
            statusEl.textContent = 'Carregando cache da plenária...';
            statusEl.classList.remove('pronto');
          }
          return;
        }
        var a = cacheCarregamento.alimentacao;
        var c = cacheCarregamento.credenciamento;
        if (a && c) {
          cachePronto = true;
          statusEl.textContent = 'Pronto para escanear ✓';
          statusEl.classList.add('pronto');
        } else {
          cachePronto = false;
          var parts = [];
          parts.push(a ? 'Alimentação ✓' : 'Alimentação...');
          parts.push(c ? 'Credenciamento ✓' : 'Credenciamento...');
          statusEl.textContent = 'Carregando cache (validação local): ' + parts.join(' • ');
          statusEl.classList.remove('pronto');
        }
      }

      function getFila() {
        try {
          var raw = localStorage.getItem(STORE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }

      function setFila(arr) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(arr));
          atualizarContador();
        } catch (e) { console.warn('setFila:', e); }
      }

      function addToFila(item) {
        var f = getFila();
        f.push(item);
        if (f.length > 2000) f = f.slice(-1500);
        setFila(f);
      }

      function clearFilaItems(ids) {
        if (!ids || ids.length === 0) return;
        var f = getFila();
        var setIds = {};
        ids.forEach(function(id) { setIds[id] = true; });
        f = f.filter(function(x) { return !setIds[x._id]; });
        setFila(f);
      }

      function clearFilaAll() {
        setFila([]);
      }

      var _idCounter = Date.now();
      function nextId() { return '_' + (++_idCounter); }

      function atualizarContador() {
        var n = getFila().length;
        if (filaContadorEl) filaContadorEl.textContent = n;
        if (btnEnviar) btnEnviar.disabled = n === 0;
      }

      function reiniciarScanner() {
        if (!html5QrCode) return;
        try {
          html5QrCode.stop().then(function() {
            html5QrCode.start(
              { facingMode: 'environment' },
              { fps: 18, qrbox: { width: 220, height: 220 } },
              onScanSuccess,
              function() {}
            ).then(function() {
              if (cacheCarregamento.alimentacao && cacheCarregamento.credenciamento) {
                atualizarStatusCarregamento();
              } else if (statusEl) {
                statusEl.textContent = 'Aponte para o QR Code.';
                statusEl.classList.remove('pronto');
              }
              processando = false;
            }).catch(function() { processando = false; });
          }).catch(function() { processando = false; });
        } catch (e) { processando = false; }
      }

      window.limparFila = function() {
        if (getFila().length === 0) return;
        if (confirm('Limpar todas as leituras pendentes?')) {
          clearFilaAll();
          carregarCacheAlimentacao();
          mostrarOverlayResultado(true, false, 'Fila limpa.');
          setTimeout(reiniciarScanner, OVERLAY_DURATION + 150);
        }
      };

      var overlayLoading = document.getElementById('overlay-loading');
      var overlayLoadingText = document.getElementById('overlay-loading-text');
      var overlayResult = document.getElementById('overlay-result');
      var overlayResultMsg = document.getElementById('overlay-result-msg');

      function mostrarOverlayLoading(mostrar, texto) {
        if (overlayLoading) {
          if (mostrar) {
            if (overlayLoadingText) overlayLoadingText.textContent = texto || 'Enviando...';
            overlayLoading.classList.add('ativo');
          } else overlayLoading.classList.remove('ativo');
        }
      }

      function mostrarOverlayResultado(ok, isWarning, msg, duracaoMs) {
        if (!overlayResult || !overlayResultMsg) return;
        overlayResult.classList.remove('tela-ok', 'tela-err', 'tela-warn');
        if (ok) overlayResult.classList.add(isWarning ? 'tela-warn' : 'tela-ok');
        else overlayResult.classList.add('tela-err');
        overlayResultMsg.textContent = msg || '';
        overlayResult.classList.add('ativo');
        var dur = (typeof duracaoMs === 'number' && duracaoMs > 0) ? duracaoMs : OVERLAY_DURATION;
        setTimeout(function() { overlayResult.classList.remove('ativo'); }, dur);
      }

      function mostrarFeedbackRapido(ok, msg) {
        mostrarOverlayResultado(ok, false, msg);
      }

      function mostrarFeedbackEnvio(ok, msg) {
        var dur = ok ? OVERLAY_ENVIO_DURATION : OVERLAY_ERRO_DURATION;
        mostrarOverlayResultado(ok, false, msg, dur);
        return dur;
      }

      var resultadoEl = document.getElementById('resultado');
      function mostrarResultado(ok, msg, isWarning) {
        if (resultadoEl) {
          resultadoEl.className = ok ? (isWarning ? 'warn' : 'ok') : 'err';
          resultadoEl.textContent = msg;
          resultadoEl.style.display = 'block';
          setTimeout(function() { resultadoEl.style.display = 'none'; resultadoEl.textContent = ''; }, 4000);
        }
      }

      window.enviarFila = function() {
        var f = getFila();
        if (f.length === 0) {
          mostrarFeedbackRapido(true, 'Nada pendente.');
          return;
        }
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          mostrarFeedbackRapido(false, 'Página deve ser aberta pelo link do Portal.');
          return;
        }
        var modo = (document.getElementById('tipo-leitura') && document.getElementById('tipo-leitura').value) || 'alimentacao';
        var alimentacao = f.filter(function(x) { return x.modo === 'alimentacao'; });
        var competicao = f.filter(function(x) { return x.modo === 'competicao'; });
        var plenaria = f.filter(function(x) { return x.modo === 'plenaria'; });

        function enviarPlenaria(itens, ids) {
          if (itens.length === 0) return Promise.resolve({ sucesso: 0, erros: [] });
          return new Promise(function(res, rej) {
            google.script.run
              .withSuccessHandler(function(r) {
                if (r && typeof r === 'object') {
                  var sucesso = r.sucesso != null ? r.sucesso : 0;
                  var erros = r.erros || [];
                  var idsComErro = {};
                  (erros || []).forEach(function(e) { if (e && e.inscricaoId) idsComErro[String(e.inscricaoId).toLowerCase()] = true; });
                  var idsParaRemover = [];
                  itens.forEach(function(item, idx) {
                    var idNorm = String(item.inscricaoId || '').toLowerCase();
                    if (!idsComErro[idNorm]) idsParaRemover.push(ids[idx]);
                  });
                  clearFilaItems(idsParaRemover);
                  if (cachePlenaria && idsParaRemover.length) {
                    itens.forEach(function(item, idx) {

      function carregarCacheAlimentacao(cb, forceRefresh) {
        if (!forceRefresh) {
          var cached = getCacheAlimentacao();
          if (cached && cached.mapaSaldo && Object.keys(cached.mapaSaldo).length > 0) {
            cacheAlimentacao = cached;
            if (cb) cb(true);
            return;
          }
        }
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          if (cb) cb(false);
          return;
        }
        google.script.run
          .withSuccessHandler(function(r) {
            if (r && r.mapaSaldo) {
              setCacheAlimentacao(r);
              if (cb) cb(true);
            } else {
              if (cb) cb(false);
            }
          })
          .withFailureHandler(function() { if (cb) cb(false); })
          .obterCacheValidacaoAlimentacao(EVENTO_ID);
      }

      function carregarCacheCredenciamento(cb, forceRefresh) {
        if (!forceRefresh) {
          var cached = getCacheCredenciamento();
          var cacheValido = cached && cached.mapaApto && Object.keys(cached.mapaApto).length > 0 &&
            cached.mapaCredenciados && cached.mapaParticipou !== undefined && cached.mapaBloqueios !== undefined;
          if (cacheValido) {
            cacheCredenciamento = cached;
            if (cb) cb(true);
            return;
          }
        }
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          if (cb) cb(false);
          return;
        }
        google.script.run
          .withSuccessHandler(function(r) {
            if (r && r.mapaApto) {
              setCacheCredenciamento(r);
              if (cb) cb(true);
            } else {
              if (cb) cb(false);
            }
          })
          .withFailureHandler(function() { if (cb) cb(false); })
          .obterCacheValidacaoCredenciamento(EVENTO_ID);
      }

      function carregarDadosIniciais(cb) {
        if (!EVENTO_ID) {
          if (cb) cb();
          return;
        }
        cacheCarregamento = { alimentacao: false, credenciamento: false };
        atualizarStatusCarregamento();
        var pendentes = 2;
        function atualizarTextoLoading() {
          var a = cacheCarregamento.alimentacao;
          var c = cacheCarregamento.credenciamento;
          var txt = 'Carregando cache do banco… ' + (a ? 'Alimentação ✓' : 'Alimentação…') + ' • ' + (c ? 'Credenciamento ✓' : 'Credenciamento…');
          mostrarOverlayLoading(true, txt);
        }
        function concluido() {
          pendentes--;
          atualizarTextoLoading();
          if (pendentes <= 0 && cb) cb();
        }
        mostrarOverlayLoading(true, 'Carregando cache do banco… Alimentação… • Credenciamento…');
        carregarCacheAlimentacao(function(ok) {
          cacheCarregamento.alimentacao = true;
          atualizarStatusCarregamento();
          concluido();
        });
        carregarCacheCredenciamento(function(ok) {
          cacheCarregamento.credenciamento = true;
          atualizarStatusCarregamento();
          concluido();
        });
        carregarModalidadesEvento();
      }

      function atualizarPainelTipo() {
        var tipoLeituraSelect = document.getElementById('tipo-leitura');
        var painelAlimentacao = document.getElementById('painel-alimentacao');
        var painelCompeticao = document.getElementById('painel-competicao');
        var painelPlenaria = document.getElementById('painel-plenaria');
        var modalidadeSelect = document.getElementById('modalidade-competicao');
        var modo = (tipoLeituraSelect && tipoLeituraSelect.value) ? tipoLeituraSelect.value : 'alimentacao';
        if (painelAlimentacao) painelAlimentacao.style.display = modo === 'alimentacao' ? 'block' : 'none';
        if (painelCompeticao) painelCompeticao.style.display = modo === 'competicao' ? 'block' : 'none';
        if (painelPlenaria) painelPlenaria.style.display = modo === 'plenaria' ? 'block' : 'none';
        if (modo === 'competicao' && EVENTO_ID) {
          carregarModalidadesEvento();
          carregarCacheCredenciamento();
        }
        if (modo === 'plenaria' && EVENTO_ID) {
          carregarCachePlenaria();
        }
      }

      function construirCachePlenariaLocal(dados) {
        if (!dados) return null;
        var limitByClube = dados.limitByClube || {};
        var credenciados = dados.credenciados || [];
        var inscricoes = dados.inscricoes || [];
        var pastPresidentes = dados.pastPresidentes || [];
        var clubeByInscricao = {};
        var nomeByInscricao = {};
        inscricoes.forEach(function(i) {
          var id = String(i.id || '').trim().toLowerCase();
          if (id) {
            clubeByInscricao[id] = (i.clubeNome || '').trim();
            nomeByInscricao[id] = (i.pessoaNome || '').trim();
          }
        });
        var pastPresidentesSet = {};
        pastPresidentes.forEach(function(p) {
          var k = (String(p.clubeNome || '').trim().toLowerCase()) + '|' + (String(p.pessoaNome || '').trim().toLowerCase());
          if (k !== '|') pastPresidentesSet[k] = true;
        });
        var credentialedSet = {};
        var countByClube = {};
        var listaCredenciados = [];
        credenciados.forEach(function(c) {
          var id = String(c.inscricaoId || '').trim().toLowerCase();
          if (!id) return;
          credentialedSet[id] = true;
          var clube = (c.clubeNome || '').trim();
          var delegadoNato = !!(c.delegadoNato === true);
          if (clube && !delegadoNato) countByClube[clube] = (countByClube[clube] || 0) + 1;
          listaCredenciados.push({ inscricaoId: c.inscricaoId, clubeNome: clube, pessoaNome: (c.pessoaNome || '').trim() || '—', delegadoNato: delegadoNato });
        });
        return { limitByClube: limitByClube, clubeByInscricao: clubeByInscricao, nomeByInscricao: nomeByInscricao, credentialedSet: credentialedSet, countByClube: countByClube, listaCredenciados: listaCredenciados, pastPresidentesSet: pastPresidentesSet };
      }

      function atualizarListaDelegadosPlenaria() {
        var totalEl = document.getElementById('plenaria-total');
        var ultimosEl = document.getElementById('plenaria-ultimos');
        if (!totalEl) return;
        if (!cachePlenaria || !cachePlenaria.listaCredenciados) {
          totalEl.textContent = '0';
          if (ultimosEl) ultimosEl.innerHTML = '';
          return;
        }
        var lista = cachePlenaria.listaCredenciados;
        totalEl.textContent = lista.length;
        if (ultimosEl) {
          var ultimos = lista.slice(-8).reverse();
          ultimosEl.innerHTML = ultimos.length === 0 ? '' : ultimos.map(function(c) { return (c.pessoaNome || '—') + ' · ' + (c.clubeNome || '—'); }).join('<br>');
        }
      }

      function carregarCachePlenaria() {
        cachePlenariaPronto = false;
        cachePlenaria = null;
        atualizarStatusCarregamento();
        atualizarListaDelegadosPlenaria();
        if (!EVENTO_ID || typeof google === 'undefined' || !google.script || !google.script.run) {
          cachePlenariaPronto = true;
          atualizarStatusCarregamento();
          return;
        }
        google.script.run
          .withSuccessHandler(function(dados) {
            cachePlenaria = construirCachePlenariaLocal(dados);
            cachePlenariaPronto = true;
            atualizarStatusCarregamento();
            atualizarListaDelegadosPlenaria();
          })
          .withFailureHandler(function() {
            cachePlenaria = null;
            cachePlenariaPronto = true;
            atualizarStatusCarregamento();
          })
          .obterCachePlenaria(EVENTO_ID);
      }

      function carregarModalidadesEvento() {
        var modalidadeSelect = document.getElementById('modalidade-competicao');
        if (!modalidadeSelect || !EVENTO_ID) return;
        modalidadeSelect.innerHTML = '<option value="">Carregando...</option>';
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          modalidadeSelect.innerHTML = '<option value="">—</option>';
          return;
        }
        google.script.run
          .withSuccessHandler(function(lista) {
            if (!modalidadeSelect) return;
            modalidadeSelect.innerHTML = '<option value="">Selecione a modalidade</option>';
            (lista || []).forEach(function(m) {
              var id = m.modalidadeId || (m.modalidade && m.modalidade.id);
              if (!id) return;
              var nomeM = (m.modalidade && m.modalidade.nome) || m.nome || '';
              var catM = (m.modalidade && m.modalidade.categoria) || m.categoria || 'Misto';
              var opt = document.createElement('option');
              opt.value = id;
              opt.textContent = nomeM + (catM ? ' (' + catM + ')' : '');
              modalidadeSelect.appendChild(opt);
            });
          })
          .withFailureHandler(function() { if (modalidadeSelect) modalidadeSelect.innerHTML = '<option value="">Erro ao carregar</option>'; })
          .listarModalidadesEvento(EVENTO_ID);
      }

      var tipoLeituraSelect = document.getElementById('tipo-leitura');
      if (tipoLeituraSelect) tipoLeituraSelect.addEventListener('change', atualizarPainelTipo);

      var modalCredenciadosLista = [];
      function abrirModalCredenciados() {
        var modalidadeSelect = document.getElementById('modalidade-competicao');
        var modId = (modalidadeSelect && modalidadeSelect.value) ? modalidadeSelect.value : '';
        if (!modId) {
          mostrarFeedbackRapido(false, 'Selecione uma modalidade.');
          return;
        }
        var modal = document.getElementById('modal-credenciados');
        var listaEl = document.getElementById('modal-credenciados-lista');
        var filtroClube = document.getElementById('modal-credenciados-clube');
        var titulo = document.getElementById('modal-credenciados-titulo');
        if (!modal || !listaEl) return;
        var nomeMod = (modalidadeSelect && modalidadeSelect.options[modalidadeSelect.selectedIndex]) ? modalidadeSelect.options[modalidadeSelect.selectedIndex].text : 'Modalidade';
        if (titulo) titulo.textContent = 'Credenciados – ' + nomeMod;
        modal.classList.add('ativo');
        listaEl.innerHTML = '<div class="modal-credenciados-vazio">Carregando...</div>';
        if (filtroClube) filtroClube.innerHTML = '<option value="">Todos os clubes</option>';
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          listaEl.innerHTML = '<div class="modal-credenciados-vazio">Página deve ser aberta pelo link do Portal.</div>';
          return;
        }
        google.script.run.withSuccessHandler(function(creds) {
          modalCredenciadosLista = Array.isArray(creds) ? creds : [];
          var clubes = [];
          var seen = {};
          modalCredenciadosLista.forEach(function(c) {
            var cl = (c.clubeNome || '').trim() || 'Sem clube';
            if (!seen[cl]) { seen[cl] = true; clubes.push(cl); }
          });
          clubes.sort();
          if (filtroClube) {
            clubes.forEach(function(cl) {
              var opt = document.createElement('option');
              opt.value = cl;
              opt.textContent = cl;
              filtroClube.appendChild(opt);
            });
            filtroClube.onchange = renderizarListaCredenciados;
          }
          renderizarListaCredenciados();
        }).withFailureHandler(function() {
          listaEl.innerHTML = '<div class="modal-credenciados-vazio">Erro ao carregar.</div>';
        }).listarCredenciadosModalidade(EVENTO_ID, modId);
      }

      function renderizarListaCredenciados() {
        var listaEl = document.getElementById('modal-credenciados-lista');
        var filtroClube = document.getElementById('modal-credenciados-clube');
        var modalidadeSelect = document.getElementById('modalidade-competicao');
        var modId = (modalidadeSelect && modalidadeSelect.value) ? modalidadeSelect.value : '';
        if (!listaEl || !modId) return;
        var clubeFiltro = (filtroClube && filtroClube.value) ? String(filtroClube.value).trim() : '';
        var filtrados = !clubeFiltro ? modalCredenciadosLista : modalCredenciadosLista.filter(function(c) {
          return String(c.clubeNome || '').trim() === clubeFiltro;
        });
        if (filtrados.length === 0) {
          listaEl.innerHTML = '<div class="modal-credenciados-vazio">' + (clubeFiltro ? 'Nenhum credenciado deste clube.' : 'Nenhum credenciado nesta modalidade.') + '</div>';
          return;
        }
        listaEl.innerHTML = '';
        filtrados.forEach(function(c) {
          var div = document.createElement('div');
          div.className = 'cred-item';
          div.innerHTML = '<div class="cred-item-info"><div class="cred-item-nome">' + String(c.pessoaNome || '').replace(/</g, '&lt;') + '</div><div class="cred-item-clube">' + String(c.clubeNome || '').replace(/</g, '&lt;') + '</div></div><button type="button" class="btn-excluir-cred" data-inscricao-id="' + String(c.inscricaoId || '').replace(/"/g, '&quot;') + '">Excluir</button>';
          var btn = div.querySelector('.btn-excluir-cred');
          if (btn) btn.onclick = function() { excluirCredenciado(c.inscricaoId, modId, div); };
          listaEl.appendChild(div);
        });
      }

      function excluirCredenciado(inscricaoId, modId, rowEl) {
        if (!inscricaoId || !modId) return;
        var btn = rowEl ? rowEl.querySelector('.btn-excluir-cred') : null;
        if (btn) btn.disabled = true;
        if (typeof google === 'undefined' || !google.script || !google.script.run) return;
        google.script.run.withSuccessHandler(function(r) {
          if (r && r.ok) {
            modalCredenciadosLista = modalCredenciadosLista.filter(function(c) { return String(c.inscricaoId) !== String(inscricaoId); });
            var chaveBloqueio = inscricaoId + '|' + modId;
            try {
              var obj = getCacheBloqueios();
              if (obj[chaveBloqueio]) { delete obj[chaveBloqueio]; setCacheBloqueios(obj); }
            } catch (e) {}
            renderizarListaCredenciados();
            carregarCacheCredenciamento(function() {}, true);
          } else {
            mostrarFeedbackRapido(false, (r && r.erro) ? r.erro : 'Erro ao excluir.');
            if (btn) btn.disabled = false;
          }
        }).withFailureHandler(function() {
          mostrarFeedbackRapido(false, 'Erro ao excluir.');
          if (btn) btn.disabled = false;
        }).removerCredenciamentoModalidade(inscricaoId, EVENTO_ID, modId);
      }

      window.abrirModalCredenciados = abrirModalCredenciados;
      window.fecharModalCredenciados = function() {
        var modal = document.getElementById('modal-credenciados');
        if (modal) modal.classList.remove('ativo');
      };

      var modalPlenariaLista = [];
      function renderizarListaPlenaria() {
        var sel = document.getElementById('modal-plenaria-clube');
        var filtroClube = (sel && sel.value) ? sel.value : '';
        var itens = filtroClube ? modalPlenariaLista.filter(function(c) { return (c.clubeNome || '') === filtroClube; }) : modalPlenariaLista;
        var cont = document.getElementById('modal-plenaria-lista');
        if (!cont) return;
        cont.innerHTML = '';
        if (itens.length === 0) {
          cont.appendChild(document.createTextNode('Nenhum credenciado na plenária' + (filtroClube ? ' para este clube.' : '.')));
          return;
        }
        itens.forEach(function(c) {
          var div = document.createElement('div');
          div.className = 'item-cred-plenaria';
          div.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #495057;';
          var txt = document.createElement('span');
          txt.textContent = (c.pessoaNome || '—') + ' · ' + (c.clubeNome || '—');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Excluir';
          btn.className = 'btn-excluir-cred';
          btn.style.cssText = 'font-size:12px;padding:4px 8px;';
          btn.onclick = function() { excluirCredenciadoPlenaria(c.inscricaoId, div); };
          div.appendChild(txt);
          div.appendChild(btn);
          cont.appendChild(div);
        });
      }
      function excluirCredenciadoPlenaria(inscricaoId, rowEl) {
        if (!inscricaoId) return;
        var btn = rowEl ? rowEl.querySelector('.btn-excluir-cred') : null;
        if (btn) btn.disabled = true;
        if (typeof google === 'undefined' || !google.script || !google.script.run) return;
        google.script.run.withSuccessHandler(function(r) {
          if (r && r.ok) {
            var idNorm = String(inscricaoId).toLowerCase().trim();
            var clubeRem = null;
            for (var i = 0; i < modalPlenariaLista.length; i++) {
              if (String(modalPlenariaLista[i].inscricaoId).toLowerCase() === idNorm) { clubeRem = modalPlenariaLista[i].clubeNome; break; }
            }
            modalPlenariaLista = modalPlenariaLista.filter(function(c) { return String(c.inscricaoId) !== String(inscricaoId); });
            if (cachePlenaria && clubeRem !== undefined && clubeRem !== null) {
              delete cachePlenaria.credentialedSet[idNorm];
              delete cachePlenaria.credentialedSet[inscricaoId];
              cachePlenaria.countByClube[clubeRem] = Math.max(0, (cachePlenaria.countByClube[clubeRem] || 1) - 1);
              cachePlenaria.listaCredenciados = cachePlenaria.listaCredenciados.filter(function(c) { return String(c.inscricaoId).toLowerCase() !== idNorm; });
              atualizarListaDelegadosPlenaria();
            }
            renderizarListaPlenaria();
          } else {
            mostrarFeedbackRapido(false, (r && r.erro) ? r.erro : 'Erro ao excluir.');
            if (btn) btn.disabled = false;
          }
        }).withFailureHandler(function() {
          mostrarFeedbackRapido(false, 'Erro ao excluir.');
          if (btn) btn.disabled = false;
        }).removerCredenciamentoPlenaria(inscricaoId, EVENTO_ID);
      }
      window.abrirModalCredenciadosPlenaria = function() {
        var modal = document.getElementById('modal-credenciados-plenaria');
        if (!modal) return;
        modal.style.display = 'flex';
        var sel = document.getElementById('modal-plenaria-clube');
        if (sel) { sel.innerHTML = '<option value="">Todos os clubes</option>'; sel.value = ''; }
        document.getElementById('modal-plenaria-lista').innerHTML = 'Carregando...';
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          document.getElementById('modal-plenaria-lista').innerHTML = 'Página deve ser aberta pelo link do Portal.';
          return;
        }
        google.script.run.withSuccessHandler(function(arr) {
          modalPlenariaLista = Array.isArray(arr) ? arr : [];
          var clubes = [];
          modalPlenariaLista.forEach(function(c) {
            var n = (c.clubeNome || '').trim();
            if (n && clubes.indexOf(n) === -1) clubes.push(n);
          });
          clubes.sort();
          if (sel) {
            clubes.forEach(function(n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
            sel.onchange = renderizarListaPlenaria;
          }
          renderizarListaPlenaria();
        }).withFailureHandler(function() {
          document.getElementById('modal-plenaria-lista').innerHTML = 'Erro ao carregar.';
        }).listarCredenciadosPlenaria(EVENTO_ID);
      };
      window.fecharModalCredenciadosPlenaria = function() {
        var modal = document.getElementById('modal-credenciados-plenaria');
        if (modal) modal.style.display = 'none';
      };

      function iniciarCameraScanner() {
        try {
          if (!EVENTO_ID) {
            mostrarErro('Link incompleto: falta o evento. Use o botão "Link do scanner" no Portal com um evento selecionado.');
            return;
          }
          if (typeof Html5Qrcode === 'undefined') {
            mostrarErro('Leitor de QR não carregou. Tente abrir em outro navegador (Chrome/Firefox no Android, Safari/Chrome no iOS).');
            return;
          }
          if (processando) return;
          processando = true;
          mostrarOverlayLoading(true, 'Carregando cache para validação rápida...');
          if (!html5QrCode) {
            html5QrCode = new Html5Qrcode('reader');
          }
          carregarDadosIniciais(function() {
            mostrarOverlayLoading(false);
            atualizarStatusCarregamento();
            try {
              html5QrCode.start(
                { facingMode: 'environment' },
                { fps: 18, qrbox: { width: 220, height: 220 } },
                onScanSuccess,
                function() {}
              ).then(function() {
                atualizarStatusCarregamento();
                processando = false;
              }).catch(function(err) {
                processando = false;
                var msg = '';
                if (err && err.message) msg = err.message;
                else if (err && err.name) msg = err.name;
                else msg = String(err || '').trim();
                if (!msg) msg = 'permissão negada ou bloqueada pelo navegador. Verifique se o site tem acesso à câmera e tente novamente.';
                mostrarErro('Câmera: ' + msg);
              });
            } catch (errStart) {
              processando = false;
              mostrarErro('Câmera: ' + (errStart && errStart.message ? errStart.message : 'não foi possível iniciar. Verifique as permissões de câmera do navegador.'));
            }
          });
        } catch (e) {
          processando = false;
          mostrarOverlayLoading(false);
          mostrarErro('Erro: ' + (e && e.message ? e.message : String(e)));
        }
      }

      try {
        atualizarPainelTipo();
        atualizarContador();
        var btnIniciar = document.getElementById('btn-iniciar-camera');
        if (btnIniciar) {
          btnIniciar.addEventListener('click', iniciarCameraScanner);
        } else {
          // Fallback: se o botão não existir, tenta iniciar da forma antiga
          iniciarCameraScanner();
        }
        var btnManual = document.getElementById('btn-adicionar-manual');
        var inputManual = document.getElementById('input-manual-uuid');
        if (btnManual && inputManual) {
          btnManual.addEventListener('click', function() {
            var raw = (inputManual.value || '').trim();
            if (!raw) {
              mostrarFeedbackRapido(false, 'Digite ou cole o código do passaporte.');
              return;
            }
            onScanSuccess(raw);
            inputManual.value = '';
          });
          inputManual.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
              e.preventDefault();
              btnManual.click();
            }
          });
        }
      } catch (e) {
        mostrarOverlayLoading(false);
        mostrarErro('Erro: ' + (e && e.message ? e.message : String(e)));
      }
    })();
  </script>
